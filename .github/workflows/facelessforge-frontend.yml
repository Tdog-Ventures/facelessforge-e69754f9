name: FacelessForge Frontend Theme & Build
on:
  push:
    branches: ['master', 'main', 'fix/**']
    paths: ['frontend/**', '.github/workflows/facelessforge-frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/facelessforge-frontend.yml']
permissions:
  contents: read
jobs:
  frontend-theme-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run full frontend unit and regression test suite
        env:
          CI: 'true'
        run: npm test -- --watchAll=false
      - name: Build production frontend bundle
        run: npm run build
      - name: Run Chromium light/dark contrast and axe-core verification
        run: |
          npm install --no-save playwright-core axe-core
          npm run verify:theme
