name: FacelessForge MCP connector
on:
  push:
    paths: ['tools/mcp/**', '.github/workflows/facelessforge-mcp.yml']
  pull_request:
    paths: ['tools/mcp/**', '.github/workflows/facelessforge-mcp.yml']
permissions:
  contents: read
jobs:
  connector:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/mcp/tests -v
