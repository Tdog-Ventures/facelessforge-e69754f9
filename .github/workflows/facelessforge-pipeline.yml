name: FacelessForge production pipeline regression gate

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/facelessforge-pipeline.yml'
  push:
    branches: ['master', 'main']
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/facelessforge-pipeline.yml'

permissions:
  contents: read

concurrency:
  group: facelessforge-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      STORAGE_MODE: local
      FF_LEGACY_PIPELINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend/app
      - name: Run production pipeline regression tests
        run: |
          python -m pytest -q \
            backend/tests/test_stock_query_compaction.py \
            backend/tests/test_generation_integrity.py \
            backend/tests/test_auto_attach_assets.py \
            backend/tests/test_asset_commit_fencing.py \
            backend/tests/test_voice_fit.py \
            backend/tests/test_duration_autofit.py \
            backend/tests/test_render_mode_lease.py \
            backend/tests/test_render_verification.py \
            backend/tests/test_completion_flags.py \
            backend/tests/test_project_status_and_delivery.py \
            backend/tests/test_youtube_oauth_callback.py
